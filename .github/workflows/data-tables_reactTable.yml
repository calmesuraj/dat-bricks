name: Build and deploy Node.js app to Azure Web App - reactTable

on:
  push:
    branches: [ data-tables ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies (monorepo)
        run: npm ci

      - name: Build server (TypeScript -> dist)
        run: npm run build -w server

      - name: Build client (Vite -> client/dist)
        run: npm run build -w client

      - name: Copy client dist into server/public
        run: |
          rm -rf server/public
          mkdir -p server/public
          cp -R client/dist/* server/public/
      # Install ONLY production deps in server so runtime has express, etc.
      - name: Install server production dependencies
        run: |
          cd server
          npm ci --omit=dev
          cd ..
      # Create zip from inside server folder (includes node_modules + dist + public + package.json)
      - name: Create deployment zip (server)
        run: |
          cd server
          zip -r ../server.zip .
          cd ..
      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: server-zip
          path: server.zip
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: server-zip

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure App Settings + Startup Command
        run: |
          az webapp config appsettings set \
            --name reactTable \
            --resource-group reactweb \
            --settings \
              SCM_DO_BUILD_DURING_DEPLOYMENT=false \
              WEBSITE_NODE_DEFAULT_VERSION=20-lts \
              DATABRICKS_HOST="${{ secrets.DATABRICKS_HOST }}" \
              DATABRICKS_HTTP_PATH="${{ secrets.DATABRICKS_HTTP_PATH }}" \
              DATABRICKS_TOKEN="${{ secrets.DATABRICKS_TOKEN }}"
          # Start from /home/site/wwwroot (zip root)
          az webapp config set \
            --name reactTable \
            --resource-group reactweb \
            --startup-file "npm start"

      - name: Verify downloaded artifact
        run: |
            ls -la server-zip || true
            unzip -l server-zip/server.zip | sed -n '1,120p' || true
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "reactTable"
          slot-name: "Production"
          package: server-zip/server.zip