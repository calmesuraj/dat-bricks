name: Build and deploy Node.js app to Azure Web App - reactTable

on:
  push:
    branches: [ data-tables ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # TEMP: disable cache while fixing rollup optional-deps issue
          # cache: "npm"

      # Option A (preferred): npm ci (requires package-lock.json in sync)
      - name: Install monorepo dependencies (clean, include optional)
        run: |
          rm -rf node_modules
          npm ci --include=optional

      # Option B (use this instead if npm ci fails due to lockfile drift)
      # - name: Install monorepo dependencies (include optional)
      #   run: |
      #     rm -rf node_modules package-lock.json
      #     npm install --include=optional

      - name: Debug rollup optional package (proof)
        run: |
          ls -la node_modules/@rollup || true
          node -e "try{require('@rollup/rollup-linux-x64-gnu'); console.log('rollup linux native: OK')}catch(e){console.error('rollup linux native: MISSING'); process.exit(1)}"

      - name: Build server
        run: npm run build -w server

      - name: Build client
        run: npm run build -w client

      - name: Copy client build into server/public
        run: |
          rm -rf server/public
          mkdir -p server/public
          cp -R client/dist/* server/public/

      # Install runtime deps into server/node_modules
      - name: Install server production dependencies into server/
        run: |
          rm -rf server/node_modules
          npm install --omit=dev --prefix server --workspaces=false

          echo "Verify server runtime deps exist:"
          ls -d server/node_modules/cors
          ls -d server/node_modules/express
          ls -d server/node_modules/@databricks/sql

      # IMPORTANT: do NOT deploy .env (use Azure App Settings)
      - name: Remove .env from deployment content
        run: rm -f server/.env

      # Ensure no tarballs are shipped
      - name: Remove any node_modules tarballs from server folder
        run: |
          rm -f server/node_modules.tar.gz
          rm -f server/node_modules.zip || true

      - name: Create deployment zip (server root)
        run: |
          rm -f server.zip
          cd server
          zip -r ../server.zip .
          cd ..

      - name: Show zip root layout (proof)
        run: unzip -l server.zip | head -n 40

      - name: Verify zip contains cors + express (proof)
        run: |
          unzip -l server.zip | grep -E "node_modules/cors/" | head -n 5
          unzip -l server.zip | grep -E "node_modules/express/" | head -n 5

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-zip
          path: server.zip
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: server-zip

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Show target webapp info (proof)
        run: |
          az webapp show \
            --name reactTable \
            --resource-group reactweb \
            --query "{name:name, state:state, hostNames:hostNames}" \
            -o json

      - name: Configure App Settings + Startup Command
        run: |
          az webapp config appsettings set \
            --name reactTable \
            --resource-group reactweb \
            --settings \
              SCM_DO_BUILD_DURING_DEPLOYMENT=false \
              WEBSITE_NODE_DEFAULT_VERSION=20-lts \
              DATABRICKS_HOST="${{ secrets.DATABRICKS_HOST }}" \
              DATABRICKS_HTTP_PATH="${{ secrets.DATABRICKS_HTTP_PATH }}" \
              DATABRICKS_TOKEN="${{ secrets.DATABRICKS_TOKEN }}" \
              AZURESQL_SERVER="${{ secrets.AZURESQL_SERVER }}" \
              AZURESQL_DATABASE="${{ secrets.AZURESQL_DATABASE }}" \
              AZURESQL_USER="${{ secrets.AZURESQL_USER }}" \
              AZURESQL_PASSWORD="${{ secrets.AZURESQL_PASSWORD }}"

          az webapp config set \
            --name reactTable \
            --resource-group reactweb \
            --startup-file "npm start"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "reactTable"
          slot-name: "Production"
          package: server.zip

      - name: Kudu cleanup stale node_modules tarball + verify cors exists
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          USER=$(echo "$PUBLISH_PROFILE" | sed -n 's/.*userName="\([^"]*\)".*/\1/p' | head -n 1)
          PASS=$(echo "$PUBLISH_PROFILE" | sed -n 's/.*userPWD="\([^"]*\)".*/\1/p' | head -n 1)
          KUDU="https://reacttable-bzfsgqd6c2etekgf.scm.azurewebsites.net"

          curl -s -X DELETE -u "$USER:$PASS" "$KUDU/api/vfs/site/wwwroot/node_modules.tar.gz" || true
          curl -s -X DELETE -u "$USER:$PASS" "$KUDU/api/vfs/site/wwwroot/node_modules.zip" || true

          curl -s -u "$USER:$PASS" "$KUDU/api/vfs/site/wwwroot/node_modules/cors/" | head -n 20 || true

      - name: Restart web app
        run: az webapp restart --name reactTable --resource-group reactweb
