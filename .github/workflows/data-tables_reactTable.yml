name: Build and deploy Node.js app to Azure Web App - reactTable

on:
  push:
    branches: [ data-tables ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # Install using the root lockfile (required for npm workspaces)
      - name: Install dependencies (monorepo)
        run: npm ci

      - name: Build server (TypeScript -> dist)
        run: npm run build -w server

      - name: Build client (Vite -> client/dist)
        run: npm run build -w client

      - name: Copy client dist into server/public
        run: |
          rm -rf server/public
          mkdir -p server/public
          cp -R client/dist/* server/public/

      # Remove dev deps after build so node_modules tarball is production-sized
      - name: Prune to production deps (workspace root)
        run: npm prune --omit=dev

      # Create node_modules.tar.gz that App Service will auto-extract at startup
      - name: Create node_modules tarball for App Service
        run: |
          rm -f server/node_modules.tar.gz
          tar -czf server/node_modules.tar.gz node_modules
          test -f server/node_modules.tar.gz

          # Sanity checks: ensure required runtime deps are inside the tarball
          tar -tzf server/node_modules.tar.gz | grep -E "^node_modules/cors/" -m 1
          tar -tzf server/node_modules.tar.gz | grep -E "^node_modules/express/" -m 1
          tar -tzf server/node_modules.tar.gz | grep -E "^node_modules/@databricks/sql/" -m 1

      # Zip only the server app (include node_modules.tar.gz, exclude any node_modules dir)
      - name: Create deployment zip (server)
        run: |
          cd server
          zip -r ../server.zip . -x "node_modules/**"
          cd ..

      - name: Verify zip contains node_modules.tar.gz
        run: |
          unzip -l server.zip | grep -E "node_modules\.tar\.gz" -n

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: server-zip
          path: server.zip
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: server-zip

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure App Settings + Startup Command
        run: |
          az webapp config appsettings set \
            --name reactTable \
            --resource-group reactweb \
            --settings \
              SCM_DO_BUILD_DURING_DEPLOYMENT=false \
              WEBSITE_NODE_DEFAULT_VERSION=20-lts \
              DATABRICKS_HOST="${{ secrets.DATABRICKS_HOST }}" \
              DATABRICKS_HTTP_PATH="${{ secrets.DATABRICKS_HTTP_PATH }}" \
              DATABRICKS_TOKEN="${{ secrets.DATABRICKS_TOKEN }}"

          az webapp config set \
            --name reactTable \
            --resource-group reactweb \
            --startup-file "npm start"

          # Apply Node version setting immediately
          az webapp restart --name reactTable --resource-group reactweb

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "reactTable"
          slot-name: "Production"
          package: server.zip