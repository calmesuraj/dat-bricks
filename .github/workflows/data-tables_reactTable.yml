name: Build and deploy Node.js app to Azure Web App - reactTable

on:
  push:
    branches: [ data-tables ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install monorepo dependencies
        run: npm install

      - name: Build server
        run: npm run build -w server

      - name: Build client
        run: npm run build -w client

      - name: Copy client build into server/public
        run: |
          rm -rf server/public
          mkdir -p server/public
          cp -R client/dist/* server/public/

      # Force production install directly into server/node_modules
      - name: Install server production dependencies
        run: |
          rm -rf server/node_modules
          npm install --omit=dev --prefix server --workspaces=false

          echo "Verify dependencies exist:"
          ls -d server/node_modules/express
          ls -d server/node_modules/cors
          ls -d server/node_modules/@databricks/sql

      # Make sure no tarball interferes
      - name: Remove any node_modules.tar.gz
        run: rm -f server/node_modules.tar.gz

      # Create zip INCLUDING node_modules
      - name: Create deployment zip
        run: |
          cd server
          zip -r ../server.zip .
          cd ..

      # Proof the zip contains dependencies
      - name: Verify zip contains dependencies
        run: |
          unzip -l server.zip | grep "node_modules/cors" | head -n 5
          unzip -l server.zip | grep "node_modules/express" | head -n 5

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-zip
          path: server.zip
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: server-zip

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Show target webapp info
        run: |
          az webapp show \
            --name reactTable \
            --resource-group reactweb \
            --query "{name:name, state:state, hostNames:hostNames}" \
            -o json

      - name: Configure App Settings
        run: |
          az webapp config appsettings set \
            --name reactTable \
            --resource-group reactweb \
            --settings \
              SCM_DO_BUILD_DURING_DEPLOYMENT=false \
              DATABRICKS_HOST="${{ secrets.DATABRICKS_HOST }}" \
              DATABRICKS_HTTP_PATH="${{ secrets.DATABRICKS_HTTP_PATH }}" \
              DATABRICKS_TOKEN="${{ secrets.DATABRICKS_TOKEN }}"

          az webapp config set \
            --name reactTable \
            --resource-group reactweb \
            --startup-file "npm start"

          az webapp restart \
            --name reactTable \
            --resource-group reactweb

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "reactTable"
          slot-name: "Production"
          package: server.zip