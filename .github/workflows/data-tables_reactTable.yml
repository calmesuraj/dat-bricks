name: Build and deploy Node.js app to Azure Web App - reactTable

on:
  push:
    branches: [ data-tables ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # Use npm install (not npm ci) because your lockfile is not stable/synced yet
      - name: Install dependencies (monorepo)
        run: npm install

      # Optional: show if npm modified package-lock.json in CI
      - name: Lockfile diagnostic
        run: |
          git status --porcelain
          git diff -- package-lock.json || true

      - name: Build server (TypeScript -> dist)
        run: npm run build -w server

      - name: Build client (Vite -> client/dist)
        run: npm run build -w client

      - name: Copy client dist into server/public
        run: |
          rm -rf server/public
          mkdir -p server/public
          cp -R client/dist/* server/public/

      # CRITICAL: install production deps INSIDE server/ so server/node_modules has express/cors/@databricks/sql
      # (Root node_modules may not contain express in your workspace layout)
      - name: Install server production dependencies (in server folder)
        run: |
          cd server
          rm -rf node_modules
          npm install --omit=dev
          test -d node_modules/express
          test -d node_modules/cors
          test -d node_modules/@databricks/sql
          cd ..

      # App Service on Linux auto-extracts node_modules.tar.gz at startup (your logs show this)
      - name: Create node_modules.tar.gz for App Service (from server)
        run: |
          rm -f server/node_modules.tar.gz
          tar -czf server/node_modules.tar.gz -C server node_modules
          test -f server/node_modules.tar.gz
          tar -tzf server/node_modules.tar.gz | grep -E "^node_modules/express($|/)" -m 1
          tar -tzf server/node_modules.tar.gz | grep -E "^node_modules/cors($|/)" -m 1
          tar -tzf server/node_modules.tar.gz | grep -E "^node_modules/@databricks/sql($|/)" -m 1

      # Zip the server app; exclude node_modules directory (we only need node_modules.tar.gz)
      - name: Create deployment zip (server)
        run: |
          cd server
          zip -r ../server.zip . -x "node_modules/**"
          cd ..

      - name: Verify zip contains node_modules.tar.gz
        run: unzip -l server.zip | grep -E "node_modules\.tar\.gz" -n

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: server-zip
          path: server.zip
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: server-zip

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure App Settings + Startup Command
        run: |
          az webapp config appsettings set \
            --name reactTable \
            --resource-group reactweb \
            --settings \
              SCM_DO_BUILD_DURING_DEPLOYMENT=false \
              WEBSITE_NODE_DEFAULT_VERSION=20-lts \
              DATABRICKS_HOST="${{ secrets.DATABRICKS_HOST }}" \
              DATABRICKS_HTTP_PATH="${{ secrets.DATABRICKS_HTTP_PATH }}" \
              DATABRICKS_TOKEN="${{ secrets.DATABRICKS_TOKEN }}"

          az webapp config set \
            --name reactTable \
            --resource-group reactweb \
            --startup-file "npm start"

          az webapp restart --name reactTable --resource-group reactweb

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "reactTable"
          slot-name: "Production"
          package: server.zip